steps:
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/rev-parts-pit:$COMMIT_SHA'
      - '.'

  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/rev-parts-pit:$COMMIT_SHA']

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'rev-parts-pit'
      - '--image=gcr.io/$PROJECT_ID/rev-parts-pit:$COMMIT_SHA'
      - '--region=us-central1'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--memory=512Mi'
      - '--cpu=1'
      - '--min-instances=0'
      - '--max-instances=5'
      # NODE_ENV is already baked into the image.
      # No FIREBASE_SERVICE_ACCOUNT_KEY needed — Cloud Run uses ADC via the
      # service account assigned to the revision (see setup steps below).

images:
  - 'gcr.io/$PROJECT_ID/rev-parts-pit:$COMMIT_SHA'
